[package]
name = "puddles_backplane"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Puddles backplane firmware"

[build-dependencies]
titan_build = { path = "../../crates/titan_build" }

[dependencies]
titan_rp2040 = { path = "../titan_rp2040" }
canmore = { path = "../../crates/canmore", features = ["defmt"] }
titan_link = { path = "../../crates/titan_link", features = ["defmt"] }
puddles_core = { path = "../../crates/puddles_core", features = ["defmt"] }

cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
# Ethernet: the WIZnet W5500 in MACRAW mode under the embassy-net (smoltcp) stack
embassy-net = { version = "0.9.1", features = ["defmt", "udp", "proto-ipv4", "medium-ethernet"] }
embassy-net-wiznet = { version = "0.3.0", features = ["defmt"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "defmt", "time-driver", "critical-section-impl", "unstable-pac", "intrinsics"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embedded-hal-async = "1.0.0"
fixed = "1.31.0"
heapless = "0.9.3"
# The bidirectional DShot PIO program
pio = "0.3"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
static_cell = "2.1.1"
