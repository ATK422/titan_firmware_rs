[package]
name = "esc_board"
# Major.minor are reported in the firmware status, like titan_generate_version_tag(esc_board 1 0)
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Talos ESC board firmware: bidirectional DShot thruster control with RPM feedback"

[build-dependencies]
titan_build = { path = "../../crates/titan_build" }

[dependencies]
titan_rp2040 = { path = "../titan_rp2040" }
canmore = { path = "../../crates/canmore", features = ["defmt"] }
titan_link = { path = "../../crates/titan_link", features = ["defmt"] }
esc_core = { path = "../../crates/esc_core", features = ["defmt"] }

cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["rp2040", "defmt", "time-driver", "critical-section-impl", "unstable-pac", "intrinsics"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
# PIO clock dividers
fixed = "1.31.0"
# Atomics shared between the cores (thumbv6m has no compare-and-swap; this goes through the multicore-safe
# critical section)
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
