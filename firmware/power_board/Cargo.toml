[package]
name = "power_board"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Talos power board firmware, plus the power stage library shared with the Poac and PoHalf boards"

# The library is the power stage every kill switch source board shares (kill switch, fan, SHT41 and MCP3426 on the
# board I2C bus); `poac_board` and `po_half_board` depend on it. The binary is the Talos power board itself.
[lib]
path = "src/lib.rs"

[[bin]]
name = "power_board"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
titan_build = { path = "../../crates/titan_build" }

[dependencies]
titan_rp2040 = { path = "../titan_rp2040" }
canmore = { path = "../../crates/canmore", features = ["defmt"] }
titan_link = { path = "../../crates/titan_link", features = ["defmt"] }
power_core = { path = "../../crates/power_core", features = ["defmt"] }

cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-embedded-hal = { version = "0.6.0", default-features = false }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["rp2040", "defmt", "time-driver", "critical-section-impl", "unstable-pac", "intrinsics"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
heapless = "0.9.3"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
static_cell = "2.1.1"
