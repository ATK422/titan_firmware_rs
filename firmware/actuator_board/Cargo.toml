[package]
name = "actuator_board"
# Major.minor are reported in the firmware status, like titan_generate_version_tag(actuator_mk2 1 0)
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Talos actuator board firmware"

[features]
# Original solenoid/coil gun actuators instead of the Dynamixel ones (USE_V2_ACTUATORS=0 in C)
v1 = []

[build-dependencies]
titan_build = { path = "../../crates/titan_build" }

[dependencies]
titan_rp2040 = { path = "../titan_rp2040" }
canmore = { path = "../../crates/canmore", features = ["defmt"] }
titan_link = { path = "../../crates/titan_link", features = ["defmt"] }
actuator_core = { path = "../../crates/actuator_core", features = ["defmt"] }
dynamixel = { path = "../dynamixel" }

cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["rp2040", "defmt", "time-driver", "critical-section-impl", "unstable-pac", "intrinsics"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
fixed = "1.31.0"
pio = "0.3.0"
